server {
    listen 80;
    server_name localhost;

    # Root fallback
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    # Frontend App Configuration
    location /frontend/ {
        alias /usr/share/nginx/html/frontend/;
        index index.html;
        try_files $uri $uri/ /frontend/index.html;
    }

    # BackOffice App Configuration
    location /bo/ {
        alias /usr/share/nginx/html/bo/;
        index index.html;
        try_files $uri $uri/ /bo/index.html;
    }
}
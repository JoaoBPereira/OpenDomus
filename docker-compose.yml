services:
  # Your existing app container (or split into backend/frontend)
  app:
    image: opendomus-app:latest
    container_name: opendomus_container
    env_file:
      - .env
    ports:
      - "8082:80"
      - "4000:4000"
    restart: unless-stopped
    depends_on:
      opendomus_postgres_db:
        condition: service_healthy

  # Dedicated PostgreSQL Container
  opendomus_postgres_db:
    image: timescale/timescaledb-ha:pg18
    container_name: opendomus_postgres_db
    env_file:
      - .env
    environment:
      # Overrides PGDATA from .env; must live inside the mounted volume
      PGDATA: /home/postgres/pgdata/data
    restart: unless-stopped
    ports:
      - "5434:5432" # Optional: expose to host machine for GUI tools (e.g., DBeaver)
    volumes:
      - opendomus_postgres_data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  opendomus_postgres_data: # Ensures data persists even if the container is removed
